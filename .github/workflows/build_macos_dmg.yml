name: Build macOS Standalone DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build_macos_dmg.yml'
      - 'gui_app.py'
      - 'automation_engine.py'
      - 'engine_stacker.py'
      - 'ensure_env.py'

permissions:
  contents: write

jobs:
  build-macos-dmg:
    name: Build macOS DMG Packages
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
          pip3 install pyinstaller
          brew install create-dmg || true

      - name: Install Playwright Browsers
        run: |
          python3 -m playwright install chromium

      - name: Build Standalone macOS App Bundle (Apple Silicon)
        run: |
          pyinstaller --noconsole --onedir --windowed \
            --name "Google AI Pro Automator" \
            --add-data "extensions:extensions" \
            --add-data "config.example.json:." \
            --add-data "README.md:." \
            --add-data "LICENSE:." \
            --collect-all customtkinter \
            --collect-all cryptography \
            gui_app.py

      - name: Package Apple Silicon Standalone DMG
        run: |
          mkdir -p dist/dmg_root
          cp -r "dist/Google AI Pro Automator.app" dist/dmg_root/
          
          # Create Apple Silicon DMG with hdiutil
          hdiutil create -volname "Google AI Pro Automator" -srcfolder dist/dmg_root -ov -format UDZO "dist/GoogleAIProAutomator-v1.3.0-macOS-AppleSilicon.dmg"

      - name: Package Universal App DMG (Compatible with Apple Silicon & Intel)
        run: |
          mkdir -p dist/universal_dmg_root
          
          # Copy app bundle & source environment
          cp -r "Google AI Pro Automator.app" dist/universal_dmg_root/
          cp -r extensions dist/universal_dmg_root/
          cp config.example.json dist/universal_dmg_root/
          cp requirements.txt dist/universal_dmg_root/
          cp *.py dist/universal_dmg_root/
          cp *.sh dist/universal_dmg_root/
          cp *.command dist/universal_dmg_root/
          ln -s /Applications dist/universal_dmg_root/Applications
          
          chmod +x dist/universal_dmg_root/*.command dist/universal_dmg_root/*.sh dist/universal_dmg_root/"Google AI Pro Automator.app"/Contents/MacOS/launcher
          
          hdiutil create -volname "Google AI Pro Automator" -srcfolder dist/universal_dmg_root -ov -format UDZO "dist/GoogleAIProAutomator-v1.3.0-macOS-Universal.dmg"
          
          # Also supply Intel-compatible DMG asset
          cp "dist/GoogleAIProAutomator-v1.3.0-macOS-Universal.dmg" "dist/GoogleAIProAutomator-v1.3.0-macOS-Intel.dmg"
          
          ls -lh dist/*.dmg

      - name: Upload All DMG Packages to GitHub Release v1.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.3.0 \
            "dist/GoogleAIProAutomator-v1.3.0-macOS-AppleSilicon.dmg" \
            "dist/GoogleAIProAutomator-v1.3.0-macOS-Universal.dmg" \
            "dist/GoogleAIProAutomator-v1.3.0-macOS-Intel.dmg" \
            --clobber
